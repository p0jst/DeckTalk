<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#34307a"/>
      <stop offset="0.55" stop-color="#1a1945"/>
      <stop offset="1" stop-color="#0a0a1f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.35" stop-color="#d9ac4b"/>
      <stop offset="0.7" stop-color="#9c6b1f"/>
      <stop offset="1" stop-color="#e8c36a"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#f6e2b2"/>
      <stop offset="1" stop-color="#e6c582"/>
    </linearGradient>
    <radialGradient id="btn" cx="40%" cy="32%" r="75%">
      <stop offset="0" stop-color="#5d6597"/>
      <stop offset="0.6" stop-color="#2c315a"/>
      <stop offset="1" stop-color="#171a36"/>
    </radialGradient>
    <radialGradient id="lit" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#f2fffd"/>
      <stop offset="0.35" stop-color="#7ff2e4"/>
      <stop offset="0.8" stop-color="#1fb7a8"/>
      <stop offset="1" stop-color="#0f7e75"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6ff5e6" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#3fd9c9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3fd9c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="10" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip"><rect x="12" y="12" width="488" height="488" rx="60"/></clipPath>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0 -10 C1.2 -2.5 2.5 -1.2 10 0 C2.5 1.2 1.2 2.5 0 10 C-1.2 2.5 -2.5 1.2 -10 0 C-2.5 -1.2 -1.2 -2.5 0 -10Z" fill="#ffe7a0"/>
    </symbol>
  </defs>

  <!-- background -->
  <rect x="4" y="4" width="504" height="504" rx="67" fill="#0a0a1f"/>
  <g clip-path="url(#frameClip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- faint arcane rings -->
    <circle cx="256" cy="232" r="214" fill="none" stroke="#e2bb5e" stroke-opacity="0.13" stroke-width="3"/>
    <circle cx="256" cy="232" r="232" fill="none" stroke="#e2bb5e" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="2 13" stroke-linecap="round"/>
    <!-- distant stars -->
    <g fill="#cfd6ff">
      <circle cx="58" cy="70" r="2.2" opacity="0.7"/><circle cx="452" cy="64" r="1.8" opacity="0.6"/>
      <circle cx="470" cy="210" r="1.6" opacity="0.5"/><circle cx="40" cy="300" r="1.8" opacity="0.5"/>
      <circle cx="300" cy="470" r="1.6" opacity="0.45"/><circle cx="210" cy="40" r="1.5" opacity="0.5"/>
    </g>
  </g>

  <!-- speech bubble -->
  <g filter="url(#shadow)">
    <path d="M142 92 H370 A72 72 0 0 1 442 164 V290 A72 72 0 0 1 370 362 H218
             C204 398 168 430 100 452 C134 418 150 392 152 362 H142
             A72 72 0 0 1 70 290 V164 A72 72 0 0 1 142 92 Z"
          fill="url(#parch)" stroke="#3b2507" stroke-width="10" stroke-linejoin="round"/>
    <!-- inner gold rim -->
    <path d="M146 106 H366 A60 60 0 0 1 426 166 V288 A60 60 0 0 1 366 348"
          fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- controller face buttons (diamond) -->
  <g>
    <!-- glow behind the pressed (top) button -->
    <circle cx="256" cy="160" r="64" fill="url(#glow)"/>

    <!-- left -->
    <circle cx="190" cy="231" r="35" fill="#000" opacity="0.18" transform="translate(0 5)"/>
    <circle cx="190" cy="231" r="34" fill="url(#btn)" stroke="#0e1024" stroke-width="5"/>
    <ellipse cx="182" cy="219" rx="15" ry="9" fill="#fff" opacity="0.22"/>
    <!-- right -->
    <circle cx="322" cy="231" r="35" fill="#000" opacity="0.18" transform="translate(0 5)"/>
    <circle cx="322" cy="231" r="34" fill="url(#btn)" stroke="#0e1024" stroke-width="5"/>
    <ellipse cx="314" cy="219" rx="15" ry="9" fill="#fff" opacity="0.22"/>
    <!-- bottom -->
    <circle cx="256" cy="297" r="35" fill="#000" opacity="0.18" transform="translate(0 5)"/>
    <circle cx="256" cy="297" r="34" fill="url(#btn)" stroke="#0e1024" stroke-width="5"/>
    <ellipse cx="248" cy="285" rx="15" ry="9" fill="#fff" opacity="0.22"/>
    <!-- top: lit / pressed -->
    <circle cx="256" cy="165" r="34" fill="url(#lit)" stroke="#0b4f4a" stroke-width="5"/>
    <ellipse cx="247" cy="152" rx="15" ry="9" fill="#fff" opacity="0.6"/>

    <!-- tap ripples -->
    <path d="M300 118 A60 60 0 0 1 314 146" fill="none" stroke="#1fb7a8" stroke-width="7" stroke-linecap="round"/>
    <path d="M318 100 A84 84 0 0 1 338 140" fill="none" stroke="#1fb7a8" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M212 118 A60 60 0 0 0 198 146" fill="none" stroke="#1fb7a8" stroke-width="7" stroke-linecap="round"/>
    <path d="M194 100 A84 84 0 0 0 174 140" fill="none" stroke="#1fb7a8" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- sparkles -->
  <use href="#spark" x="384" y="384" width="44" height="44"/>
  <use href="#spark" x="440" y="420" width="24" height="24" opacity="0.8"/>
  <use href="#spark" x="408" y="446" width="16" height="16" opacity="0.6"/>
  <use href="#spark" x="36" y="40" width="22" height="22" opacity="0.55"/>

  <!-- gold frame -->
  <rect x="12" y="12" width="488" height="488" rx="60" fill="none" stroke="url(#gold)" stroke-width="13"/>
  <rect x="21" y="21" width="470" height="470" rx="52" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="3"/>
  <rect x="6" y="6" width="500" height="500" rx="65" fill="none" stroke="#2a1a04" stroke-width="3"/>
</svg>
